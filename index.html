<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quick Paste</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script></head><body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4"><div class="w-full max-w-xl"><h1 class="text-xl font-bold text-indigo-400 mb-4">Quick Paste</h1><textarea id="ta" rows="12" placeholder="Paste anything here..." class="w-full bg-gray-900 border border-gray-700 rounded-xl p-4 text-sm text-gray-200 font-mono resize-y focus:border-indigo-500 outline-none"></textarea><div class="flex gap-2 mt-3"><button onclick="create()" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg text-sm">Create Link</button><button onclick="copy()" id="cp" class="py-2 px-4 bg-gray-800 border border-gray-700 text-gray-300 rounded-lg text-sm hover:border-gray-500 disabled:opacity-50" disabled>Copy</button></div><p id="msg" class="text-xs text-gray-500 mt-2 text-center"></p></div><script>const ta=document.getElementById('ta'),cp=document.getElementById('cp'),msg=document.getElementById('msg');let url='';(function(){const h=location.hash.slice(1);if(h)try{ta.value=LZString.decompressFromEncodedURIComponent(h)}catch(e){}})();function create(){if(!ta.value.trim())return msg.textContent='Nothing to paste';const c=LZString.compressToEncodedURIComponent(ta.value);url=location.origin+location.pathname+'#'+c;location.hash=c;cp.disabled=false;msg.textContent='Link ready! Click Copy'}function copy(){navigator.clipboard.writeText(url).then(()=>msg.textContent='Copied!')}</script></body></html>
